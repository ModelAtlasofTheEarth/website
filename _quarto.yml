# =============================================================================
# _quarto.yml — M@TE Quarto site configuration
# =============================================================================
#
# Quarto-powered M@TE (Model Atlas of the Earth) website. Built from the
# remains for the original Gatsby wesite.
# =============================================================================

project:
  type: website
  output-dir: _site
  resources:
    - models/_graphics/
    - models/featured.json

website:
  title: "M@TE"
  description: "Model Atlas of the Earth (M@TE)."

  # ── Top navigation bar ────────────────────────────────────────────────────
  navbar:
    background: "#F0F8FA"
    logo: images/atlas-icon.svg
    logo-alt: "M@TE logo"
    left:
      - text: "Models"
        href: models/index.qmd
        # Disable Tags and Creators for now
      #      - text: "Tags"
      #        href: tags/index.qmd
      #      - text: "Creators"
      #        href: creators/index.qmd
      - text: "News"
        href: news/index.qmd
      - text: "About"
        href: about.qmd
      - text: "Contact"
        href: contact.qmd
    right:
      - icon: github
        href: https://github.com/ModelAtlasofTheEarth
        aria-label: GitHub

  # ── Footer ────────────────────────────────────────────────────────────────
  page-footer:
    left: "© M@TE — Model Atlas of the Earth"
    right: "Built with [Quarto](https://quarto.org)"

# ── Output format ─────────────────────────────────────────────────────────────
format:
  html:
    theme: cosmo
    css: styles/mate.css
    toc: false
    filters:
      - _extensions/mate/model-page.py
    include-after-body:
      - scripts/model-tabs.js
      - scripts/featured-carousel.js
